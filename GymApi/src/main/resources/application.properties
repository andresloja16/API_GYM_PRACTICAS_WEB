spring.application.name=pulse-gym-api
server.port=${PORT:3000}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pulse;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
app.seed-demo=${SEED_DEMO:true}
app.jwt-secret=${JWT_SECRET:}
app.jwt-issuer=pulse-gym
app.zone=America/Bogota
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
